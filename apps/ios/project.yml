# Optional: regenerate the Xcode project with `xcodegen generate` if the hand-written
# PhotoPlus.xcodeproj ever drifts. Prefer opening PhotoPlus.xcodeproj directly.
name: PhotoPlus
options:
  bundleIdPrefix: com.yahaa
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  PhotoPlus:
    type: application
    platform: iOS
    sources:
      - path: PhotoPlus
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yahaa.photoplus
      INFOPLIST_FILE: PhotoPlus/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1.0"
