# Source of truth for the Xcode project. After adding or removing files, run on the Mac:
#   xcodegen generate
# and commit the regenerated PhotoPlus.xcodeproj.
name: PhotoPlus
options:
  bundleIdPrefix: com.yahaa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  LM_SKIP_METADATA_EXTRACTION: "YES"
targets:
  PhotoPlus:
    type: application
    platform: iOS
    sources:
      - path: PhotoPlus
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yahaa.photoplus
      INFOPLIST_FILE: PhotoPlus/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PhotoPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoPlusTests
    dependencies:
      - target: PhotoPlus
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      PRODUCT_BUNDLE_IDENTIFIER: com.yahaa.photoplus.tests
  PhotoPlusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhotoPlusUITests
    dependencies:
      - target: PhotoPlus
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      PRODUCT_BUNDLE_IDENTIFIER: com.yahaa.photoplus.uitests
schemes:
  PhotoPlus:
    build:
      targets:
        PhotoPlus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoPlusTests
        - PhotoPlusUITests
