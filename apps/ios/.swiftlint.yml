# Zero warnings expected: `swiftlint lint --strict --quiet` from apps/ios.
included:
  - PhotoPlus
  - PhotoPlusTests
  - PhotoPlusUITests
disabled_rules:
  # SwiftUI's sheet(onDismiss:) { content } style takes an action closure before the trailing one.
  - multiple_closures_with_trailing_closure
opt_in_rules:
  - first_where
  - contains_over_first_not_nil
  - last_where
  - toggle_bool
  - sorted_first_last
  - modifier_order
identifier_name:
  min_length: 1
  max_length: 60
line_length:
  warning: 160
  ignores_comments: true
  ignores_urls: true
