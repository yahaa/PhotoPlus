# Single-node SeaweedFS: master + volume + filer (local dirs as volume mounts).
# The filer has no auth, so host ports stay on loopback; only the Go API talks to it.
services:
  master:
    image: chrislusf/seaweedfs:latest
    command: "master -ip=master -port=9333 -mdir=/data"
    ports:
      - "127.0.0.1:9333:9333"
    volumes:
      - ./data/master:/data
    restart: unless-stopped

  volume:
    image: chrislusf/seaweedfs:latest
    command: "volume -mserver=master:9333 -ip=volume -port=8080 -dir=/data -max=100"
    volumes:
      - ./data/volume:/data
    depends_on:
      - master
    restart: unless-stopped

  filer:
    image: chrislusf/seaweedfs:latest
    command: "filer -master=master:9333 -ip=filer -port=8888"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./data/filer:/data
    depends_on:
      - master
      - volume
    restart: unless-stopped
